<a 
  [href]="contact.url" 
  [target]="contact.type !== 'email' ? '_blank' : '_self'"
  [rel]="contact.type !== 'email' ? 'noopener noreferrer' : ''"
  class="contact-link group">
  
  <!-- Icon -->
  <span class="contact-link__icon" aria-hidden="true">
    <app-icon [name]="iconName" cssClass="w-5 h-5" />
  </span>
  
  <!-- Info -->
  <div>
    <p class="text-textPrimary font-medium">{{ contact.value }}</p>
    <p class="text-textSecondary text-xs">{{ contact.label }}</p>
  </div>
</a>
