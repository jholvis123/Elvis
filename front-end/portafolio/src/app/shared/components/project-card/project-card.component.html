<article
  class="card h-full flex flex-col gap-4 reveal"
  [style.transition-delay.ms]="index * 100"
  role="listitem">

  <div class="rounded-xl bg-gradient-to-br from-primary/10 via-surface to-surface p-4 border border-slate-800">
    <div class="flex items-center justify-between text-sm text-textSecondary gap-2">
      <span class="capitalize">{{ categoryLabel }}</span>
      <span class="text-primary shrink-0">{{ year }}</span>
    </div>
    <h3 class="text-lg font-semibold text-textPrimary mt-2 break-words">{{ project.title }}</h3>
    <p class="text-sm text-textSecondary">{{ project.short_description }}</p>
  </div>

  <div class="flex flex-wrap gap-2 text-xs text-textSecondary" role="list" aria-label="Tecnologías usadas">
    <span
      *ngFor="let tag of tags"
      class="pill"
      role="listitem">
      {{ tag }}
    </span>
  </div>

  <div class="flex items-center justify-between mt-auto gap-2">
    <a
      [routerLink]="['/projects', project.id]"
      class="text-primary hover:text-primaryHover text-sm font-semibold inline-flex items-center gap-1 group transition-all duration-300 min-h-[44px]"
      [attr.aria-label]="'Ver proyecto ' + project.title">
      Ver proyecto
      <span class="group-hover:translate-x-1 transition-transform" aria-hidden="true">→</span>
    </a>
    <span class="text-xs text-textSecondary shrink-0">Entrega end-to-end</span>
  </div>
</article>
