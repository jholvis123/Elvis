<div class="markdown-editor" [class.fullscreen]="isFullscreen()">
    <!-- Toolbar -->
    <div class="editor-toolbar">
        <div class="toolbar-group">
            <button
                *ngFor="let action of toolbarActions"
                type="button"
                class="toolbar-btn"
                [title]="action.label + (action.shortcut ? ' (' + action.shortcut + ')' : '')"
                (click)="action.action()"
            >
                <app-icon *ngIf="action.iconName" [name]="action.iconName" cssClass="w-4 h-4"></app-icon>
                <span *ngIf="!action.iconName" class="toolbar-icon">{{ action.icon }}</span>
            </button>
        </div>
        
        <div class="toolbar-group">
            <button
                type="button"
                class="toolbar-btn"
                [class.active]="viewMode() === 'split'"
                title="Vista dividida"
                (click)="setViewMode('split')"
            >
                <app-icon name="puzzle-piece" cssClass="w-4 h-4" ariaLabel="Vista dividida"></app-icon>
            </button>
            <button
                type="button"
                class="toolbar-btn"
                [class.active]="viewMode() === 'edit'"
                title="Solo editor"
                (click)="setViewMode('edit')"
            >
                <app-icon name="pencil-square" cssClass="w-4 h-4" ariaLabel="Solo editor"></app-icon>
            </button>
            <button
                type="button"
                class="toolbar-btn"
                [class.active]="viewMode() === 'preview'"
                title="Solo preview"
                (click)="setViewMode('preview')"
            >
                <app-icon name="eye" cssClass="w-4 h-4" ariaLabel="Solo preview"></app-icon>
            </button>
            <button
                type="button"
                class="toolbar-btn"
                [class.active]="isFullscreen()"
                title="Pantalla completa (F11)"
                (click)="toggleFullscreen()"
            >
                <app-icon [name]="isFullscreen() ? 'arrows-pointing-in' : 'arrows-pointing-out'" cssClass="w-4 h-4" ariaLabel="Pantalla completa"></app-icon>
            </button>
        </div>
        
        <div class="toolbar-info">
            <span class="save-indicator saving inline-flex items-center gap-1" *ngIf="isSaving()"><app-icon name="archive-box" cssClass="w-3.5 h-3.5"></app-icon> Guardando...</span>
            <span class="save-indicator unsaved" *ngIf="!isSaving() && hasChanges()">Sin guardar</span>
            <span class="save-indicator saved inline-flex items-center gap-1" *ngIf="!isSaving() && !hasChanges()"><app-icon name="check-circle" cssClass="w-3.5 h-3.5"></app-icon> Guardado</span>
            <span class="word-count">{{ wordCount() }} palabras · {{ readTime() }} min</span>
        </div>
    </div>
    
    <!-- Editor Container -->
    <div class="editor-container" [class.view-mode]="viewMode()">
        <!-- Editor Panel -->
        <div class="editor-panel"
             *ngIf="viewMode() !== 'preview'"
             (dragover)="onDragOver($event)"
             (dragleave)="onDragLeave($event)"
             (drop)="onDrop($event)"
             [class.drag-over]="isDragging()">
            
            <div class="line-numbers" #lineNumbers>
                <span class="line-number" *ngFor="let line of lineNumbersArray()">{{ line }}</span>
            </div>
            
            <textarea
                #editorTextarea
                class="editor-textarea"
                [value]="content()"
                (input)="onContentChange($event)"
                (keydown)="onKeyDown($event)"
                (scroll)="syncScroll($event)"
                (paste)="onPaste($event)"
                [placeholder]="placeholder"
                spellcheck="false"
            ></textarea>
            
            <div class="drop-overlay" *ngIf="isDragging()">
                <app-icon name="photo" cssClass="w-10 h-10 text-primary drop-icon" ariaLabel="Imagen"></app-icon>
                <span class="drop-text">Suelta la imagen aquí</span>
            </div>
        </div>
        
        <!-- Preview Panel -->
        <div class="preview-panel" *ngIf="viewMode() !== 'edit'" #previewPanel>
            <div class="preview-loading" *ngIf="isRendering()">
                <app-icon name="arrow-down-tray" cssClass="w-5 h-5 animate-pulse"></app-icon>
                <span>Renderizando...</span>
            </div>
            <div 
                class="preview-content markdown-body"
                *ngIf="!isRendering()"
                [innerHTML]="renderedHtml()"
            ></div>
        </div>
    </div>
    
    <!-- Status Bar -->
    <div class="editor-statusbar">
        <div class="status-left">
            <span class="status-item">Línea {{ cursorLine() }}, Col {{ cursorColumn() }}</span>
            <span class="status-item languages" *ngIf="languagesUsed().length > 0">
                Lenguajes: {{ languagesUsed().join(', ') }}
            </span>
        </div>
        <div class="status-right">
            <span class="status-item">Markdown</span>
        </div>
    </div>
</div>
