<div class="bg-surface border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-lg reveal-right hover:border-primary/30 transition-all duration-500 min-w-0 w-full overflow-hidden">
  <div *ngIf="submitSuccess" class="mb-4 p-4 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400" role="status">
    <p class="flex items-center gap-2">
      <app-icon name="check-circle" cssClass="w-5 h-5 shrink-0"></app-icon>
      ¡Mensaje enviado! Te responderé pronto.
    </p>
  </div>

  <div *ngIf="submitError" class="mb-4 p-4 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400" role="alert">
    <p class="flex items-center gap-2">
      <app-icon name="x-circle" cssClass="w-5 h-5 shrink-0"></app-icon>
      Error al enviar. Por favor, intenta de nuevo.
    </p>
  </div>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-4" aria-label="Formulario de contacto">
    <div>
      <label for="contact-name" class="block text-sm text-textSecondary mb-2">Nombre</label>
      <input
        type="text"
        id="contact-name"
        formControlName="name"
        placeholder="Tu nombre"
        class="input min-h-[44px]"
        autocomplete="name"
        [class.border-red-500]="f['name'].touched && f['name'].invalid"
        [attr.aria-invalid]="f['name'].touched && f['name'].invalid"
        aria-required="true" />
      <p *ngIf="f['name'].touched && f['name'].errors?.['required']" class="text-red-400 text-xs mt-1" id="contact-name-error">
        El nombre es requerido
      </p>
    </div>

    <div>
      <label for="contact-email" class="block text-sm text-textSecondary mb-2">Email</label>
      <input
        type="email"
        id="contact-email"
        formControlName="email"
        placeholder="correo&#64;ejemplo.com"
        class="input min-h-[44px]"
        autocomplete="email"
        inputmode="email"
        [class.border-red-500]="f['email'].touched && f['email'].invalid"
        [attr.aria-invalid]="f['email'].touched && f['email'].invalid"
        aria-required="true" />
      <p *ngIf="f['email'].touched && f['email'].errors?.['required']" class="text-red-400 text-xs mt-1">
        El email es requerido
      </p>
      <p *ngIf="f['email'].touched && f['email'].errors?.['email']" class="text-red-400 text-xs mt-1">
        Ingresa un email válido
      </p>
    </div>

    <div>
      <label for="contact-project" class="block text-sm text-textSecondary mb-2">Tipo de proyecto</label>
      <select
        id="contact-project"
        formControlName="projectType"
        class="input min-h-[44px]"
        [class.border-red-500]="f['projectType'].touched && f['projectType'].invalid"
        [attr.aria-invalid]="f['projectType'].touched && f['projectType'].invalid"
        aria-required="true">
        <option value="">Selecciona una opción</option>
        <option *ngFor="let type of projectTypes" [value]="type.value">{{ type.label }}</option>
      </select>
      <p *ngIf="f['projectType'].touched && f['projectType'].errors?.['required']" class="text-red-400 text-xs mt-1">
        Selecciona un tipo de proyecto
      </p>
    </div>

    <div>
      <label for="contact-message" class="block text-sm text-textSecondary mb-2">Mensaje</label>
      <textarea
        id="contact-message"
        formControlName="message"
        rows="4"
        placeholder="Cuéntame sobre tu proyecto o reto..."
        class="input min-h-[120px]"
        [class.border-red-500]="f['message'].touched && f['message'].invalid"
        [attr.aria-invalid]="f['message'].touched && f['message'].invalid"
        aria-required="true"></textarea>
      <p *ngIf="f['message'].touched && f['message'].errors?.['required']" class="text-red-400 text-xs mt-1">
        El mensaje es requerido
      </p>
      <p *ngIf="f['message'].touched && f['message'].errors?.['minlength']" class="text-red-400 text-xs mt-1">
        El mensaje debe tener al menos 10 caracteres
      </p>
    </div>

    <button
      type="submit"
      class="btn-primary w-full min-h-[44px] flex items-center justify-center gap-2"
      [disabled]="isSubmitting"
      [class.opacity-50]="isSubmitting"
      [class.cursor-not-allowed]="isSubmitting">
      <app-icon *ngIf="!isSubmitting" name="paper-airplane" cssClass="w-5 h-5"></app-icon>
      <span *ngIf="isSubmitting" class="inline-block animate-spin w-5 h-5 border-2 border-black/30 border-t-black rounded-full" aria-hidden="true"></span>
      {{ isSubmitting ? 'Enviando...' : 'Enviar mensaje' }}
    </button>
  </form>
</div>
