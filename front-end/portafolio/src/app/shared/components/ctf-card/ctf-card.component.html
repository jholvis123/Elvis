<article 
  class="ctf-card group"
  [class.ctf-card--solved]="isSolved">
  
  <!-- Header -->
  <div class="ctf-card__header">
    <div class="flex items-center gap-2">
      <app-icon *ngIf="categoryInfo?.icon as catIcon" [name]="catIcon" cssClass="w-5 h-5 text-primary"></app-icon>
      <span class="text-xs text-textSecondary uppercase tracking-wide">{{ categoryInfo?.label }}</span>
    </div>
    <div class="flex items-center gap-2">
      <!-- Difficulty Badge -->
      <span 
        class="px-2 py-0.5 text-xs rounded-full border"
        [ngClass]="difficultyColorClass">
        {{ difficultyInfo?.label }}
      </span>
      <!-- Solved Badge -->
      <span *ngIf="isSolved" class="px-2 py-0.5 text-xs rounded-full bg-primary/20 text-primary border border-primary/30 inline-flex items-center gap-1"><app-icon name="check-circle" cssClass="w-3.5 h-3.5" ariaLabel=""></app-icon> Resuelto</span>
    </div>
  </div>

  <!-- Content -->
  <div class="ctf-card__content">
    <h3 class="ctf-card__title">{{ challenge.title }}</h3>
    <p *ngIf="showDetails" class="ctf-card__description">{{ challenge.description }}</p>
    
    <!-- Skills -->
    <div class="ctf-card__skills" *ngIf="challenge.skills.length">
      <span 
        *ngFor="let skill of challenge.skills" 
        class="ctf-card__skill">
        {{ skill }}
      </span>
    </div>

    <!-- Attachments/Resources -->
    <div class="ctf-card__attachments" *ngIf="challenge.attachments?.length">
      <span 
        *ngFor="let attachment of challenge.attachments" 
        class="ctf-card__attachment"
        [ngClass]="getAttachmentClass(attachment.type)"
        [title]="attachment.name">
        <app-icon class="ctf-card__attachment-icon" [name]="getAttachmentIconName(attachment.type)" cssClass="w-4 h-4"></app-icon>
        <span class="ctf-card__attachment-label">{{ getAttachmentLabel(attachment.type) }}</span>
      </span>
    </div>
  </div>

  <!-- Footer -->
  <div class="ctf-card__footer">
    <div class="flex items-center gap-4 text-xs text-textSecondary">
      <span class="flex items-center gap-1">
        <app-icon name="currency-dollar" cssClass="w-4 h-4"></app-icon>
        {{ challenge.points }} pts
      </span>
      <span class="flex items-center gap-1">
        <app-icon name="user-group" cssClass="w-4 h-4"></app-icon>
        {{ challenge.solvedCount }} resueltos
      </span>
    </div>

    <a 
      [routerLink]="['/ctf', challenge.id]"
      class="ctf-card__cta"
      [attr.aria-label]="isSolved ? 'Ver reto ' + challenge.title : 'Resolver reto ' + challenge.title">
      {{ isSolved ? 'Ver detalles' : 'Resolver' }}
      <app-icon name="arrow-right" cssClass="w-4 h-4 group-hover:translate-x-1 transition-transform" ariaLabel=""></app-icon>
    </a>
  </div>
</article>
