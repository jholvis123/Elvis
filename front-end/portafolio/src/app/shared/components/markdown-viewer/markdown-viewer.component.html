<!-- Loading State -->
<div *ngIf="isLoading()" class="markdown-loading">
    <div class="loading-spinner">
        <svg class="spinner" viewBox="0 0 50 50" aria-hidden="true">
            <circle cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
        </svg>
    </div>
    <span>Renderizando contenido...</span>
</div>

<!-- Error State -->
<div *ngIf="error()" class="markdown-error">
    <app-icon name="x-circle" cssClass="w-5 h-5"></app-icon>
    <span>{{ error() }}</span>
</div>

<!-- Screen-reader / a11y live region for copy feedback -->
<div class="sr-only" aria-live="polite">{{ copyStatus() }}</div>

<!-- Main Content -->
<article
    *ngIf="!isLoading() && !error() && renderedHtml()"
    #contentArea
    class="markdown-content prose"
    [innerHTML]="renderedHtml()"
    (click)="handleContentClick($event)">
</article>

<!-- Empty State -->
<div *ngIf="!isLoading() && !error() && !renderedHtml()" class="markdown-empty">
    <app-icon name="document-text" cssClass="w-12 h-12"></app-icon>
    <p>No hay contenido para mostrar</p>
</div>

<!-- Image Lightbox -->
<div
    *ngIf="lightboxImage()"
    class="lightbox-overlay"
    (click)="closeLightbox()">
    <button type="button" class="lightbox-close" aria-label="Cerrar imagen">
        <app-icon name="x-mark" cssClass="w-6 h-6"></app-icon>
    </button>
    <img [src]="lightboxImage()" alt="Imagen ampliada" (click)="$event.stopPropagation()"/>
</div>
