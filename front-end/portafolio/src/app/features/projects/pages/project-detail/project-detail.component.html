<div class="page-section container mx-auto px-4 py-12" *ngIf="!loading && project">
  <!-- Back -->
  <a
    routerLink="/projects"
    class="inline-flex items-center gap-2 text-textSecondary hover:text-primary transition-colors mb-8 min-h-[44px]">
    <app-icon name="chevron-left" cssClass="w-5 h-5" ariaLabel=""></app-icon>
    Volver a proyectos
  </a>

  <!-- Header with Image -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
    <!-- Image -->
    <div
      class="rounded-2xl overflow-hidden bg-gradient-to-br from-slate-900 via-cyan-950/40 to-slate-900 border border-slate-800/70 min-h-[16rem] flex items-center justify-center">
      <img
        *ngIf="project.image_url; else projectImagePlaceholder"
        [src]="project.image_url"
        [alt]="project.title"
        class="w-full h-96 object-cover" />
      <ng-template #projectImagePlaceholder>
        <app-icon name="photo" cssClass="w-16 h-16 text-primary/40" ariaLabel=""></app-icon>
      </ng-template>
    </div>

    <!-- Info -->
    <div class="flex flex-col justify-center min-w-0">
      <p class="eyebrow">Proyecto</p>
      <div class="flex flex-wrap items-center gap-3 mb-4">
        <h1 class="section-heading text-3xl sm:text-4xl m-0">{{ project.title }}</h1>
        <span
          *ngIf="project.featured"
          class="inline-flex items-center gap-1.5 bg-primary/15 text-primary border border-primary/30 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wide">
          <app-icon name="star" cssClass="w-3.5 h-3.5" ariaLabel=""></app-icon>
          Destacado
        </span>
      </div>

      <p class="muted-text text-lg mb-6">{{ project.short_description }}</p>

      <!-- Technologies -->
      <div class="mb-6" *ngIf="project.technologies?.length">
        <h2 class="text-sm font-semibold text-textPrimary mb-3 uppercase tracking-wide">Tecnologías</h2>
        <div class="flex flex-wrap gap-2">
          <span
            *ngFor="let tech of project.technologies"
            class="bg-primary/15 text-primary border border-primary/25 px-3 py-1 rounded-lg text-sm">
            {{ tech }}
          </span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap gap-3">
        <a
          *ngIf="project.github_url"
          [href]="project.github_url"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-outline gap-2">
          <app-icon name="github" cssClass="w-5 h-5" ariaLabel=""></app-icon>
          Ver en GitHub
        </a>

        <a
          *ngIf="project.demo_url"
          [href]="project.demo_url"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-primary gap-2">
          <app-icon name="arrow-top-right-on-square" cssClass="w-5 h-5" ariaLabel=""></app-icon>
          Ver Demo
        </a>

        <!-- Admin Actions -->
        <a
          *ngIf="authService.isAdmin"
          [routerLink]="['/projects', project.id, 'edit']"
          class="btn-outline gap-2">
          <app-icon name="pencil-square" cssClass="w-5 h-5" ariaLabel=""></app-icon>
          Editar
        </a>

        <button
          *ngIf="authService.isAdmin"
          type="button"
          (click)="confirmDelete()"
          class="btn-outline gap-2 text-red-400 border-red-500/40 hover:bg-red-500/10 hover:text-red-300 hover:border-red-400/60">
          <app-icon name="trash" cssClass="w-5 h-5" ariaLabel=""></app-icon>
          Eliminar
        </button>
      </div>
    </div>
  </div>

  <!-- Description -->
  <section class="card mb-8 hover:translate-y-0">
    <h2 class="text-xl font-bold text-textPrimary mb-4">Descripción</h2>
    <div class="muted-text leading-relaxed whitespace-pre-line">
      {{ project.description }}
    </div>
  </section>

  <!-- Highlights -->
  <section
    *ngIf="project.highlights && project.highlights.length > 0"
    class="card hover:translate-y-0">
    <h2 class="text-xl font-bold text-textPrimary mb-4">Características destacadas</h2>
    <ul class="space-y-3 m-0 p-0 list-none">
      <li *ngFor="let highlight of project.highlights" class="flex items-start gap-3">
        <app-icon name="check" cssClass="w-5 h-5 text-primary shrink-0 mt-0.5" ariaLabel=""></app-icon>
        <span class="muted-text">{{ highlight }}</span>
      </li>
    </ul>
  </section>
</div>

<!-- Loading State -->
<div *ngIf="loading" class="container mx-auto px-4 py-20">
  <app-loading-spinner label="Cargando proyecto"></app-loading-spinner>
</div>

<!-- Error State -->
<div *ngIf="error && !loading" class="container mx-auto px-4 py-20">
  <div class="card border-red-500/40 text-center max-w-md mx-auto space-y-4 hover:translate-y-0" role="alert">
    <app-icon name="exclamation-triangle" cssClass="w-10 h-10 text-warning mx-auto" ariaLabel=""></app-icon>
    <p class="muted-text m-0">{{ error }}</p>
    <a routerLink="/projects" class="btn-outline inline-flex">Volver a proyectos</a>
  </div>
</div>

<app-confirm-dialog
  [open]="showDeleteModal"
  title="Eliminar proyecto"
  [message]="'¿Eliminar el proyecto ' + (project?.title || '') + '?'"
  (confirmed)="deleteProject()"
  (cancelled)="cancelDelete()">
</app-confirm-dialog>
