<section id="projects" class="section bg-slate-950/60" aria-labelledby="projects-heading">
  <div class="max-w-6xl mx-auto px-4 sm:px-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-8 reveal">
      <div>
        <p class="eyebrow">Proyectos</p>
        <h2 id="projects-heading" class="section-heading">Casos destacados</h2>
      </div>
      <a href="#contact" class="text-primary hover:text-primaryHover transition-all duration-300 text-sm inline-flex items-center gap-1 group min-h-[44px]">
        Solicitar demo
        <span class="group-hover:translate-x-1 transition-transform" aria-hidden="true">→</span>
      </a>
    </div>

    <div *ngIf="loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" aria-busy="true">
      <div *ngFor="let i of [1, 2, 3]" class="card h-64 animate-pulse">
        <div class="rounded-xl bg-slate-800/50 p-4 h-full">
          <div class="h-4 bg-slate-700 rounded w-1/3 mb-4"></div>
          <div class="h-6 bg-slate-700 rounded w-2/3 mb-2"></div>
          <div class="h-4 bg-slate-700 rounded w-full"></div>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && projects.length === 0" class="text-center py-12 reveal">
      <app-icon name="rocket-launch" cssClass="w-12 h-12 text-primary mx-auto mb-4"></app-icon>
      <h3 class="text-xl font-semibold text-textPrimary mb-2">Próximamente</h3>
      <p class="text-textSecondary">
        Los proyectos destacados aparecerán aquí una vez publicados.
      </p>
    </div>

    <div *ngIf="!loading && projects.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" role="list" aria-label="Lista de proyectos">
      <app-project-card
        *ngFor="let project of projects; let i = index"
        [project]="project"
        [index]="i">
      </app-project-card>
    </div>
  </div>
</section>
