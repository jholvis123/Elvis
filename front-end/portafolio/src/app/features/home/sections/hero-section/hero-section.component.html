<section id="hero" class="relative overflow-hidden bg-slate-950" aria-label="Sección principal">
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-cyan-500/10 via-transparent to-primary/5 blur-3xl"></div>
  <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-16 sm:pt-24 pb-12 md:pb-24 relative z-10">
    <div class="grid md:grid-cols-2 gap-10 md:gap-12 items-center">
      <div class="space-y-6 animate-fade-in-up min-w-0">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-primary/10 text-primary text-sm font-semibold border border-primary/20">
          <span class="sr-only">Estado:</span>
          Disponible para proyectos
          <span class="w-2 h-2 rounded-full bg-primary animate-pulse" aria-hidden="true"></span>
        </div>

        <div class="space-y-3">
          <p class="text-sm uppercase tracking-[0.25rem] text-textSecondary">Desarrollo · Ciberseguridad · CTF</p>
          <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-textPrimary leading-tight">
            Yhon Elvis Siñani Pocoata
          </h1>
          <p class="text-lg sm:text-xl text-primary min-h-8 flex items-center">
            <span class="typing-text">{{ currentRole }}</span>
            <span class="typing-cursor" aria-hidden="true">|</span>
          </p>
          <p class="text-base sm:text-lg text-textSecondary max-w-xl">
            Ingeniero de Sistemas con conocimientos en ciberseguridad. Construyo productos digitales seguros,
            escalables y centrados en la experiencia.
          </p>
        </div>

        <div class="flex flex-col sm:flex-row flex-wrap gap-3" role="group" aria-label="Acciones principales">
          <a href="#projects" class="btn-primary" aria-label="Ver mis proyectos">
            <span class="flex items-center justify-center gap-2">
              <app-icon name="folder" cssClass="w-5 h-5"></app-icon>
              Ver proyectos
            </span>
          </a>
          <a routerLink="/ctf" class="btn-outline" aria-label="Ir al laboratorio CTF">
            <span class="flex items-center justify-center gap-2">
              <app-icon name="puzzle-piece" cssClass="w-5 h-5"></app-icon>
              CTF Lab
            </span>
          </a>
          <a href="#contact" class="border border-slate-700 text-textSecondary px-6 py-2 rounded hover:border-primary hover:text-primary transition-all duration-300 inline-flex items-center justify-center gap-2 min-h-[44px]" aria-label="Contactarme">
            <app-icon name="envelope" cssClass="w-5 h-5"></app-icon>
            Contactar
          </a>
        </div>

        <div class="grid grid-cols-3 gap-2 sm:gap-4 max-w-md" role="list" aria-label="Estadísticas destacadas">
          <app-stat-card
            *ngFor="let item of highlights; let i = index"
            [value]="item.value"
            [label]="item.label"
            [delay]="i * 100">
          </app-stat-card>
        </div>

        <div class="flex flex-wrap gap-2 text-sm" role="list" aria-label="Tecnologías">
          <app-tech-badge
            *ngFor="let tech of technologies"
            [name]="tech">
          </app-tech-badge>
        </div>
      </div>

      <div class="hidden md:block">
        <app-code-block></app-code-block>
      </div>
    </div>
  </div>
</section>
