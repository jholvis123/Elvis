<section id="contact" class="section" aria-labelledby="contact-heading">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 grid lg:grid-cols-2 gap-8 items-start min-w-0">
    <div class="space-y-4 reveal-left">
      <p class="eyebrow">Contacto</p>
      <h2 id="contact-heading" class="section-heading">Construyamos algo seguro</h2>
      <p class="muted-text">Cuéntame sobre tu reto y te responderé con una propuesta concreta.</p>

      <div *ngIf="contactInfo.length; else noContactLinks" class="space-y-4 text-sm text-textSecondary">
        <app-contact-link
          *ngFor="let contact of contactInfo"
          [contact]="contact">
        </app-contact-link>
      </div>
      <ng-template #noContactLinks>
        <p *ngIf="apiUnavailable" class="text-sm text-textSecondary border border-slate-800 rounded-lg p-4 bg-surface/50">
          Datos de contacto no disponibles: API no configurada o sin conexión.
        </p>
      </ng-template>
    </div>

    <app-contact-form
      [projectTypes]="projectTypes"
      [apiUnavailable]="apiUnavailable">
    </app-contact-form>
  </div>
</section>
