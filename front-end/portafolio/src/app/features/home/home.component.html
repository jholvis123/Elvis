<!-- Home Page - Orquestador de secciones -->
<p class="sr-only" role="status" aria-live="polite">{{ homeLoadingStatus }}</p>
<div class="home-sections">
<!-- Hero Section -->
<app-hero-section
  [technologies]="technologies"
  [roles]="roles"
  [avatarUrl]="avatarUrl"
  [githubUrl]="githubUrl"
  [linkedinUrl]="linkedinUrl"
  [projectTitles]="projectTitles"
  [projectsCount]="sections.projectsCount()"
  [ctfCount]="sections.ctfCount()"
  [writeupsCount]="sections.writeupsCount()"
  [showProjectsCta]="sections.showProjectsNav()"
  [showCtfCta]="sections.showCtfNav()">
</app-hero-section>

<!-- Franja del stack: movimiento constante (linear), se pausa al pasar el ratón -->
<div *ngIf="technologies.length" class="stack-strip" role="region" aria-label="Stack tecnológico">
  <ul class="sr-only">
    <li *ngFor="let tech of technologies">{{ tech }}</li>
  </ul>
  <div class="stack-strip__track" aria-hidden="true">
    <div *ngFor="let copy of stripCopies" class="stack-strip__group">
      <ng-container *ngFor="let tech of technologies">
        <span class="stack-strip__item">{{ tech }}</span>
        <span class="stack-strip__sep">◆</span>
      </ng-container>
    </div>
  </div>
</div>

<!-- About Section -->
<app-about-section
  [aboutPoints]="aboutPoints"
  [stackItems]="stackItems"
  [avatarUrl]="avatarUrl"
  [stackLine]="roles.length ? roles.join(' · ') : null"
  [showCtfLink]="sections.showCtfNav()">
</app-about-section>

<!-- Experience / Capabilities — hidden when API returns empty (skeletons while loading) -->
<app-experience-section
  *ngIf="sections.showExperienceSection()"
  [items]="experienceItems"
  [capabilities]="capabilities"
  [loading]="loadingExperience"
  [loadingCapabilities]="loadingCapabilities"
  [apiUnavailable]="apiUnavailable"
  [experienceError]="experienceError"
  [capabilitiesError]="capabilitiesError">
</app-experience-section>

<!-- Projects Section -->
<app-projects-section
  *ngIf="sections.showProjectsSection()"
  [projects]="projects"
  [loading]="loadingProjects"
  [apiUnavailable]="apiUnavailable">
</app-projects-section>

<!-- CTF Lab: adelanto con retos y ranking reales -->
<app-ctf-section *ngIf="sections.showCtfNav()"></app-ctf-section>

<!-- Contact Section -->
<app-contact-section
  [contactInfo]="contactInfo"
  [projectTypes]="projectTypes"
  [apiUnavailable]="apiUnavailable">
</app-contact-section>

</div>

<!-- Scroll to Top Button -->
<app-scroll-to-top
  [show]="showScrollTop"
  (scrollTop)="scrollToTop()">
</app-scroll-to-top>
