<div class="auth-page min-h-screen flex items-center justify-center bg-background px-4 py-12">
  <div class="pointer-events-none fixed inset-0 bg-gradient-to-b from-cyan-500/10 via-transparent to-primary/5 blur-3xl" aria-hidden="true"></div>

  <div class="relative max-w-md w-full">
    <div class="text-center mb-8">
      <p class="eyebrow">Acceso</p>
      <h1 class="section-heading text-3xl md:text-4xl mb-2">Bienvenido</h1>
      <p class="muted-text">Inicia sesión en tu cuenta</p>
    </div>

    <div class="auth-card">
      <div
        *ngIf="errorMessage"
        class="mb-6 p-4 rounded-lg bg-red-500/10 border border-red-500/40"
        role="alert"
        aria-live="assertive">
        <p class="text-red-300 text-sm">{{ errorMessage }}</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-5">
          <label for="identifier" class="block text-sm font-medium text-textPrimary mb-2">
            Correo o alias
          </label>
          <input
            type="text"
            id="identifier"
            formControlName="identifier"
            class="input min-h-[44px]"
            placeholder="tu&#64;email.com o tu alias"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            [attr.aria-invalid]="identifier?.invalid && identifier?.touched"
            [attr.aria-describedby]="identifier?.invalid && identifier?.touched ? 'identifier-error' : null"
            [class.border-red-500]="identifier?.invalid && identifier?.touched"
          />
          <div *ngIf="identifier?.invalid && identifier?.touched" id="identifier-error" class="mt-1 text-red-400 text-sm" role="alert">
            <span *ngIf="identifier?.errors?.['required']">Escribe tu correo o tu alias</span>
          </div>
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-textPrimary mb-2">
            Contraseña
          </label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="input min-h-[44px]"
            placeholder="••••••••"
            autocomplete="current-password"
            [attr.aria-invalid]="password?.invalid && password?.touched"
            [attr.aria-describedby]="password?.invalid && password?.touched ? 'password-error' : null"
            [class.border-red-500]="password?.invalid && password?.touched"
          />
          <div *ngIf="password?.invalid && password?.touched" id="password-error" class="mt-1 text-red-400 text-sm" role="alert">
            <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
            <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
          </div>
        </div>

        <button
          type="submit"
          class="btn-primary w-full"
          [disabled]="loading"
          [attr.aria-busy]="loading">
          <span *ngIf="!loading">Iniciar sesión</span>
          <span *ngIf="loading" class="inline-flex items-center gap-2">
            <span
              class="inline-block h-5 w-5 rounded-full border-2 border-black/30 border-t-black motion-safe-spin"
              aria-hidden="true"></span>
            Iniciando sesión…
          </span>
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-sm muted-text">
      ¿Quieres jugar los retos?
      <a routerLink="/auth/register" class="text-primary hover:underline font-semibold">Crea tu alias</a>
    </p>

    <div class="mt-2 text-center">
      <a routerLink="/" class="muted-text hover:text-primary text-sm inline-flex items-center min-h-[44px] px-2 transition-colors">
        Volver al inicio
      </a>
    </div>
  </div>
</div>
