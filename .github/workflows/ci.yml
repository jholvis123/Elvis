name: 🚀 Pipeline de Integración Continua

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # 🐍 CI BACKEND
  # ============================================
  
  backend-lint:
    name: 🐍 Lint y Formato Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-end
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './back-end/requirements.txt'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort mypy

      - name: 🔍 Ruff - Linter Rápido
        run: |
          ruff check app/ --output-format=github

      # TASK backlog: soft until format/type debt cleared; ruff+pytest are hard
      - name: 🎨 Black - Verificar Formato
        continue-on-error: true
        run: |
          black --check --diff app/

      # TASK backlog: soft until format/type debt cleared; ruff+pytest are hard
      - name: 📋 isort - Verificar Orden de Imports
        continue-on-error: true
        run: |
          isort --check-only --diff app/

      # TASK backlog: soft until format/type debt cleared; ruff+pytest are hard
      - name: 🔎 MyPy - Verificación de Tipos
        continue-on-error: true
        run: |
          mypy app/ --ignore-missing-imports

  backend-test:
    name: 🧪 Pruebas Backend
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: ./back-end
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: test_db
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: './back-end/requirements.txt'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: 🧪 Ejecutar Pruebas
        env:
          DATABASE_URL: mysql+pymysql://testuser:testpassword@localhost:3306/test_db
          SECRET_KEY: clave-secreta-solo-para-pruebas-ci
        run: |
          pytest app/tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: 📊 Subir Cobertura
        uses: codecov/codecov-action@v4
        with:
          files: ./back-end/coverage.xml
          flags: backend
          name: cobertura-backend
        continue-on-error: true

  # ============================================
  # 🅰️ CI FRONTEND
  # ============================================
  
  frontend-lint:
    name: 🅰️ Lint y Formato Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end/portafolio
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 📗 Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './front-end/portafolio/package-lock.json'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 ESLint - Análisis de Código
        run: npx ng lint

      # TASK backlog: soft until prettier format debt cleared; ng lint is hard
      - name: 🎨 Prettier - Verificar Formato
        continue-on-error: true
        run: |
          npx prettier --check "src/**/*.{ts,html,scss}"

  frontend-build:
    name: 🏗️ Compilar Frontend
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: ./front-end/portafolio
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 📗 Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './front-end/portafolio/package-lock.json'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Compilar para Producción
        run: npm run build -- --configuration production

      - name: 📦 Subir Artefacto de Compilación
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front-end/portafolio/dist/
          retention-days: 7

  frontend-test:
    name: 🧪 Pruebas Frontend
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: ./front-end/portafolio
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 📗 Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './front-end/portafolio/package-lock.json'

      - name: 📦 Instalar dependencias
        run: npm ci

      # TASK backlog: soft until karma suite stabilized; ng lint + pytest + ruff are hard
      - name: 🧪 Ejecutar Pruebas Unitarias
        continue-on-error: true
        run: |
          npm test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage

  # ============================================
  # 🐳 COMPILACIÓN DOCKER
  # ============================================
  
  docker-build:
    name: 🐳 Prueba de Compilación Docker
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Compilar Imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          push: false
          tags: portfolio-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Compilar Imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          push: false
          tags: portfolio-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 📋 RESUMEN CI
  # ============================================
  
  ci-summary:
    name: 📋 Resumen CI
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build, frontend-test, docker-build]
    if: always()
    
    steps:
      - name: 📊 Generar Resumen
        run: |
          echo "## 🚀 Resumen del Pipeline de CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Trabajo | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 Lint Backend | ${{ needs.backend-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Pruebas Backend | ${{ needs.backend-test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🅰️ Lint Frontend | ${{ needs.frontend-lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Compilación Frontend | ${{ needs.frontend-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Pruebas Frontend (soft) | ${{ needs.frontend-test.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Compilación Docker | ${{ needs.docker-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY


      - name: ❌ Fallar si algún hard-fail falló
        if: |
          needs.backend-lint.result != 'success' ||
          needs.backend-test.result != 'success' ||
          needs.frontend-lint.result != 'success' ||
          needs.frontend-build.result != 'success' ||
          needs.docker-build.result != 'success'
        run: |
          echo "Uno o más trabajos hard-fail de CI fallaron (frontend-test/karma es soft)."
          exit 1
